name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      # Vitest is blocking: all tests must pass. Eslint remains
      # non-blocking until the pre-existing WowDash template file
      # warnings are cleaned up (drop its `|| true` at that time).
      - run: npx vitest run --reporter=verbose 2>&1
      - run: npx eslint . --max-warnings=0 2>&1 || true
