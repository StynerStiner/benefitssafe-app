name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      # Vitest is blocking: all tests must pass. Eslint remains
      # non-blocking until the pre-existing WowDash template file
      # warnings are cleaned up (drop its `|| true` at that time).
      - run: npx vitest run --reporter=verbose 2>&1
      # BSRS Ch 5 P4.3 — convention linter. Blocks a new route from
      # bypassing the auth-guard (Rule A), reading session.user.role
      # directly (Rule B), or returning bare NextResponse.json errors
      # without a correlationId (Rule C). Allowlist grandfathers
      # legacy routes; see docs/runbooks/auth-guard-convention.md.
      - run: node scripts/lint/auth-guard-convention.mjs
      # BSRS Ch 8 P2b — write-path db-health convention linter. Blocks
      # a new write route from shipping without assertDbHealthy() and
      # the DbUnavailableError → 503 mapping.
      - run: node scripts/lint/db-health-convention.mjs
      # BSRS Ch 8 P2c — read-path stale-cache convention linter. Blocks
      # a new GET route from shipping without cachedWithStaleness()
      # degraded-mode fallback.
      - run: node scripts/lint/stale-cache-convention.mjs
      - run: npx eslint . --max-warnings=0 2>&1 || true
